name: CLA Assistant

# Asks each contributor to sign the Contributor License Agreement (CLA.md) on
# their first pull request, then records the signature. The CTO must finish the
# setup on the public repo before this runs:
#   1. Create a PERSONAL_ACCESS_TOKEN secret with repo scope. It stores the
#      signatures at path-to-signatures below; to keep them in a separate repo,
#      add remote-organization-name and remote-repository-name.
#   2. Confirm the CLA document link below points at the published CLA.md.
# Until the token exists, this job is inactive and blocks nothing.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-22.04
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    # Map the secret to an env value here. The `secrets` context is not available
    # in a step-level `if`, so the step guard below reads this instead. This keeps
    # the job inactive until the CTO sets the token.
    env:
      HAS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
    steps:
      - name: CLA Assistant
        if: env.HAS_TOKEN == 'true'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/klaayinc/klaay-cli/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot]
          custom-notsigned-prcomment: >
            Thank you for your pull request. Please sign the
            [Contributor License Agreement](https://github.com/klaayinc/klaay-cli/blob/main/CLA.md)
            before Klaay can merge it. Add a comment with this exact text:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. Thank you.
